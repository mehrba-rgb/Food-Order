<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه سفارش غذای تور چهارگاه</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 16px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; text-align: center; color: #1a365d; margin-bottom: 20px; }
    .status-banner { background: #fed7d7; color: #9b2c2c; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 16px; display: none; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 15px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 8px; font-size: 16px; }
    .menu-title { font-size: 17px; font-weight: bold; margin: 20px 0 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; color: #2d3748; }
    .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
    .food-name { font-size: 16px; font-weight: 500; }
    .counter { display: flex; align-items: center; gap: 10px; }
    .btn-count { width: 38px; height: 38px; background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; }
    .count-display { font-size: 18px; font-weight: bold; min-width: 24px; text-align: center; }
    .btn-submit { width: 100%; padding: 14px; background: #2b6cb0; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 24px; }
    .btn-submit:disabled { background: #a0aec0; cursor: not-allowed; }
    .leader-btn { display: block; width: 100%; text-align: center; margin-top: 30px; padding: 10px; background: #edf2f7; color: #4a5568; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; border: 1px solid #cbd5e0; }
    #status-msg { margin-top: 15px; text-align: center; font-size: 15px; font-weight: bold; }
 
    /* پاپ‌آپ‌ها */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 99999; justify-content: center; align-items: center; padding: 16px; }
    .modal-box { background: #fff; width: 100%; max-width: 440px; border-radius: 12px; padding: 22px; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 16px; }
    .btn-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #718096; font-weight: bold; }
    .toggle-box { display: flex; justify-content: space-between; align-items: center; background: #edf2f7; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .btn-toggle { padding: 9px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-active { background: #38a169; color: #fff; }
    .btn-inactive { background: #e53e3e; color: #fff; }
    .add-food-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-food-box input { flex: 1; }
    .btn-add { background: #3182ce; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: bold; cursor: pointer; }
    .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; }
    .btn-del { background: #fff5f5; color: #e53e3e; border: 1px solid #feb2b2; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
 
<div class="container">
  <h1>سامانه سفارش غذای تور چهارگاه</h1>
 
  <div id="closed-alert" class="status-banner">ثبت سفارش در حال حاضر توسط لیدر بسته است.</div>
 
  <div class="input-group">
    <label for="traveler-name">نام و نام خانوادگی همسفر:</label>
    <input type="text" id="traveler-name" placeholder="مثال: علی رضایی">
  </div>
 
  <div class="menu-title">لیست غذاها</div>
  
  <!-- لیست قطعی و ثابت غذاها -->
  <div id="food-list">
    <div class="food-item" id="item-چلو گردن">
      <span class="food-name">چلو گردن</span>
      <div class="counter">
        <button type="button" class="btn-count" onclick="changeQty('چلو گردن', -1)">-</button>
        <span class="count-display" id="qty-چلو گردن">0</span>
        <button type="button" class="btn-count" onclick="changeQty('چلو گردن', 1)">+</button>
      </div>
    </div>
    <div class="food-item" id="item-چلو کباب کوبیده">
      <span class="food-name">چلو کباب کوبیده</span>
      <div class="counter">
        <button type="button" class="btn-count" onclick="changeQty('چلو کباب کوبیده', -1)">-</button>
        <span class="count-display" id="qty-چلو کباب کوبیده">0</span>
        <button type="button" class="btn-count" onclick="changeQty('چلو کباب کوبیده', 1)">+</button>
      </div>
    </div>
    <div class="food-item" id="item-چلو جوجه کباب">
      <span class="food-name">چلو جوجه کباب</span>
      <div class="counter">
        <button type="button" class="btn-count" onclick="changeQty('چلو جوجه کباب', -1)">-</button>
        <span class="count-display" id="qty-چلو جوجه کباب">0</span>
        <button type="button" class="btn-count" onclick="changeQty('چلو جوجه کباب', 1)">+</button>
      </div>
    </div>
    <div class="food-item" id="item-سوپ جو">
      <span class="food-name">سوپ جو</span>
      <div class="counter">
        <button type="button" class="btn-count" onclick="changeQty('سوپ جو', -1)">-</button>
        <span class="count-display" id="qty-سوپ جو">0</span>
        <button type="button" class="btn-count" onclick="changeQty('سوپ جو', 1)">+</button>
      </div>
    </div>
    <div class="food-item" id="item-ماست موسیر">
      <span class="food-name">ماست موسیر</span>
      <div class="counter">
        <button type="button" class="btn-count" onclick="changeQty('ماست موسیر', -1)">-</button>
        <span class="count-display" id="qty-ماست موسیر">0</span>
        <button type="button" class="btn-count" onclick="changeQty('ماست موسیر', 1)">+</button>
      </div>
    </div>
    <div class="food-item" id="item-نوشابه">
      <span class="food-name">نوشابه</span>
      <div class="counter">
        <button type="button" class="btn-count" onclick="changeQty('نوشابه', -1)">-</button>
        <span class="count-display" id="qty-نوشابه">0</span>
        <button type="button" class="btn-count" onclick="changeQty('نوشابه', 1)">+</button>
      </div>
    </div>
  </div>
 
  <button type="button" class="btn-submit" id="submit-btn" onclick="submitOrder()">ثبت سفارش</button>
  <div id="status-msg"></div>
 
  <!-- دکمه ورود به پنل لیدر -->
  <button type="button" class="leader-btn" onclick="openPasswordModal()">⚙️ ورود به پنل مدیریت لیدر</button>
</div>
 
<!-- پنجره رمز عبور -->
<div id="password-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 style="margin:0; font-size: 17px;">ورود به پنل مدیریت لیدر</h3>
      <button type="button" class="btn-close" onclick="closePasswordModal()">✕</button>
    </div>
    <div class="input-group">
      <label>رمز عبور لیدر را وارد کنید:</label>
      <input type="password" id="leader-password" placeholder="رمز پیش‌فرض: 1234">
    </div>
    <button type="button" class="btn-submit" style="margin-top: 8px;" onclick="checkLeaderPassword()">تایید و ورود</button>
  </div>
</div>
 
<!-- پنجره پنل مدیریت لیدر -->
<div id="leader-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 style="margin:0; font-size: 18px;">مدیریت رستوران و منو</h3>
      <button type="button" class="btn-close" onclick="closeLeaderModal()">✕</button>
    </div>
 
    <div class="toggle-box">
      <span style="font-weight: bold; font-size: 14px;">وضعیت سفارش‌گیری مسافران:</span>
      <button type="button" id="toggle-order-btn" class="btn-toggle btn-active" onclick="toggleOrderingStatus()">فعال است</button>
    </div>
 
    <div style="font-weight: bold; margin-bottom: 8px; font-size: 15px;">افزودن غذای جدید:</div>
    <div class="add-food-box">
      <input type="text" id="new-food-name" placeholder="نام غذای جدید...">
      <button type="button" class="btn-add" onclick="addNewFood()">+ افزودن</button>
    </div>
 
    <div style="font-weight: bold; margin-bottom: 8px; font-size: 15px;">غذاهای فعال:</div>
    <div id="manage-food-list"></div>
  </div>
</div>
 
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFBFq8mAZbz_eTXv84NUtmAL_trp0VMr6WV5qWQptKaPsxvkfuh03m8pRUSb78FZqd/exec";
 
  let foodList = ["چلو گردن", "چلو کباب کوبیده", "چلو جوجه کباب", "سوپ جو", "ماست موسیر", "نوشابه"];
  let orders = {};
  let isOrderingActive = true;
 
  // مقداردهی اولیه
  foodList.forEach(item => { orders[item] = 0; });
 
  function changeQty(foodName, delta) {
    if (!isOrderingActive) return;
    const current = orders[foodName] || 0;
    const updated = Math.max(0, current + delta);
    orders[foodName] = updated;
    const el = document.getElementById("qty-" + foodName);
    if (el) el.innerText = updated;
  }
 
  function updateOrderStatusUI() {
    const submitBtn = document.getElementById("submit-btn");
    const closedAlert = document.getElementById("closed-alert");
    const toggleBtn = document.getElementById("toggle-order-btn");
 
    if (isOrderingActive) {
      submitBtn.disabled = false;
      closedAlert.style.display = "none";
      if (toggleBtn) {
        toggleBtn.innerText = "فعال است";
        toggleBtn.className = "btn-toggle btn-active";
      }
    } else {
      submitBtn.disabled = true;
      closedAlert.style.display = "block";
      if (toggleBtn) {
        toggleBtn.innerText = "بسته است";
        toggleBtn.className = "btn-toggle btn-inactive";
      }
    }
  }
 
  function submitOrder() {
    if (!isOrderingActive) {
      alert("سفارش‌گیری در حال حاضر بسته است.");
      return;
    }
 
    const name = document.getElementById("traveler-name").value.trim();
    const statusMsg = document.getElementById("status-msg");
    const submitBtn = document.getElementById("submit-btn");
 
    if (!name) {
      alert("لطفاً نام و نام خانوادگی خود را بنویسید.");
      return;
    }
 
    const selectedItems = [];
    for (const [item, count] of Object.entries(orders)) {
      if (count > 0) {
        selectedItems.push(item + " (" + count + " عدد)");
      }
    }
 
    if (selectedItems.length === 0) {
      alert("لطفاً حداقل یک غذا انتخاب کنید.");
      return;
    }
 
    submitBtn.disabled = true;
    statusMsg.style.color = "#2b6cb0";
    statusMsg.innerText = "در حال ارسال سفارش...";
 
    const payload = {
      name: name,
      order: selectedItems.join("، ")
    };
 
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusMsg.style.color = "green";
      statusMsg.innerText = "سف
